<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待機室 暑さ・天気ボード（渋川市石原）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c2733; --ink:#f4efe6; --mute:rgba(255,255,255,.72); --line:rgba(255,255,255,.16);
    --lv-bg:#1d55c2; --lv-fg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"BIZ UDPGothic","Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",sans-serif;
    font-feature-settings:"tnum";line-height:1.2}
  body{width:min(100vw,calc(100vh * 16 / 9));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:4.6vh 29.5vh 24.7vh 36.8vh;gap:.8vh;padding:1vh 1.6vw;background:var(--bgimg,linear-gradient(180deg,var(--sky,var(--bg)) 0%,var(--sky,var(--bg)) 26%,var(--bg) 58%));box-shadow:inset 0 0 0 var(--frame-w,0) var(--frame,transparent);transition:background 1s}
  html{background:var(--page,var(--bg))}
  section{min-height:0;overflow:hidden}

  header{display:flex;justify-content:space-between;align-items:baseline;min-width:0;line-height:1.1}
  header h1{font-size:3vh;font-weight:400;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;margin-right:1vw}
  header h1 b{color:var(--ink);font-weight:700}
  #clock{white-space:nowrap;flex:none;color:var(--ink)}
  #clock .d{font-size:2.9vh;font-weight:400;color:var(--mute);margin-right:.7vw}
  #clock .t{font-size:4.6vh;font-weight:700;letter-spacing:.01em}
  .status{font-size:2.1vh;color:rgba(255,255,255,.55);white-space:nowrap;flex:none;margin-right:1.4vw}
  .status .warn{color:#f2c400;margin-right:.8vw}
  /* 気象庁の警報・注意報（渋川市に発表中のもの） */
  .wchip{display:inline-block;padding:.15vh .6vw;margin-right:.5vw;border-radius:.5vh;font-size:2.6vh;font-weight:700;line-height:1.3;vertical-align:.15vh}
  .wchip.w20{background:#f2c400;color:#1c1a12}
  .wchip.w30{background:#d9382e;color:#ffffff}
  .wchip.w40{background:#7b2d8e;color:#ffffff}
  .wchip.w50{background:#111111;color:#ffffff;box-shadow:inset 0 0 0 .25vh #ffffff}
  .wchip.camp{background:#2f9e6b;color:#ffffff;font-weight:700}          /* 行事（安全週間など） */
  .days{display:grid;grid-template-columns:auto auto auto;column-gap:.5vw;row-gap:.5vh;align-items:center;justify-content:start;
    font-size:min(2.55vh,1.42vw);color:var(--mute);margin-top:1.4vh;line-height:1.2;white-space:nowrap}
  .days .n{color:var(--mute)}
  .days .w{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:.3vw}
  .days .w svg{width:3.6vh;height:3.6vh}
  .days .tp{color:var(--mute)}
  .days .tp b{color:var(--ink);font-weight:700}
  .cur #sun{font-size:min(2.9vh,1.6vw)}

  /* 上段：遠目用の現在値 */
  .cur{display:grid;grid-template-columns:.95fr .95fr 1.2fr 1.45fr 1.25fr;gap:0}
  .cur > div{padding:.5vh 1vw;border-left:1px solid var(--line);min-width:0;overflow:hidden}
  .cur > div:first-child{border-left:0}
  .k{font-size:min(2.6vh,1.5vw);color:var(--mute);white-space:nowrap}
  .v{font-size:min(13.8vh,7.7vw);font-weight:700;line-height:1;margin-top:.3vh;white-space:nowrap;letter-spacing:-.02em}
  .v .u{font-size:min(4vh,2.25vw);font-weight:400;margin-left:.08em;letter-spacing:0}
  .s{font-size:min(2.6vh,1.46vw);color:var(--mute);margin-top:.7vh;white-space:nowrap}
  .al{display:inline-block;margin-top:.6vh;padding:.3vh 1vw;border-radius:.6vh;font-size:min(3.2vh,1.8vw);font-weight:700;white-space:nowrap;background:#f2c400;color:#1c1a12;max-width:100%;overflow:hidden;text-overflow:ellipsis}
    .al:empty{display:none}
  td.warn{color:#f2c400;text-shadow:0 0 .35vh rgba(0,0,0,.55)}
  .wbgt{background:var(--lv-bg);color:var(--lv-fg);transition:background .6s;border-left:none;box-shadow:0 0 0 .22vh rgba(255,255,255,.45)}
  .wbgt .k{color:inherit;opacity:.85}
  .wbgt.center{text-align:center}
  .wbgt .v{font-size:min(17vh,9.5vw)}
  .wbgt .v .dec{font-size:.55em;font-weight:700;letter-spacing:0}
  .wbgt .v .unit{font-size:.28em;font-weight:400;margin-left:.08em;letter-spacing:0}
  .neg{margin-right:-.06em}
  .wbgt.winter .v{font-size:min(15vh,8.4vw)}
  .wbgt.winter .v .unit{font-size:.33em;margin-left:-.04em}
  .wbgt .lv{font-size:min(6.4vh,3.6vw);font-weight:700;margin-top:.3vh;white-space:nowrap}
  .wbgt .lv.small{font-size:min(3.8vh,2.1vw);margin-top:1.2vh}
  .cwx{display:flex;align-items:center;gap:.8vw;margin-top:1.8vh}
  .cwx svg{width:min(12.5vh,7vw);height:min(12.5vh,7vw);flex:none}
  .cwx .t{font-size:min(7.2vh,4vw);font-weight:700;line-height:1.1;white-space:nowrap}
  .wind{display:flex;align-items:center;gap:.8vw;margin-top:1.8vh}
  .wind svg{width:min(9vh,5vw);height:min(9vh,5vw);flex:none;transition:transform .8s}
  .wind .dir{font-size:min(4.2vh,2.36vw);font-weight:700;white-space:nowrap}
  .wind .spd{font-size:min(8.4vh,4.7vw);font-weight:700;white-space:nowrap;line-height:1}
  .wind .spd .u{font-size:min(3.4vh,1.9vw);font-weight:400;margin-left:.15em}

  /* グラフ（WBGT）＋ 気温の細帯 */
  .chart{display:grid;grid-template-rows:auto 1fr;row-gap:.4vh;min-height:0}
  .chart .k{font-size:2.75vh;line-height:1.15;white-space:nowrap;overflow:hidden;display:flex;align-items:baseline}
  .chart .k .lg{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .chart .k .src{margin-left:auto;flex:none;padding-left:1vw;font-size:1.9vh;color:rgba(255,255,255,.55)}
  .diag{margin-right:.9vw}
  .diag .d{display:inline-block;width:1.1vh;height:1.1vh;border-radius:50%;margin-right:.35vw;vertical-align:middle;background:rgba(255,255,255,.25)}
  .diag .d.ok{background:#3ec97c}
  .diag .d.ng{background:#ff5a4e}
  .diag .ng{color:#ff8a80;margin-right:.5vw}
  .chart .k b{color:var(--ink);font-weight:400}
  .chart svg{width:100%;height:100%;display:block}
  .chart text{font-family:inherit}
  .chip{display:inline-block;width:2.4vh;height:2.4vh;vertical-align:-.35vh;margin:0 .3vw 0 1vw;border-radius:.3vh}

  /* 表 */
  .tbl{min-height:0}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{text-align:center;vertical-align:middle;border-top:1px solid var(--line);padding:0 .2vw;overflow:hidden;white-space:nowrap;line-height:1}
  th{color:var(--mute);font-weight:400;font-size:3.1vh;text-align:left;padding-left:.4vw;width:6.2vw}
  tr.r-hd th,tr.r-hd td{border-top:0;font-size:3.2vh;color:var(--mute);height:3vh}
  tr.r-hd td.hl{color:var(--ink);font-weight:700}
  td.hl{background:rgba(255,255,255,.14)}
  tr.r-wx td{height:5.8vh}
  tr.r-wx svg{width:3.8vh;height:3.8vh;display:block;margin:0 auto}
  tr.r-wx small{display:block;font-size:2.3vh;color:var(--mute);margin-top:.2vh;line-height:1.05}
  tr.r-num td{font-size:4.2vh;font-weight:700;height:4.5vh}
  tr.r-num.pr td{font-size:3.8vh;height:4.2vh}
  tr.r-num td small{font-size:2.4vh;font-weight:400;color:var(--mute)}
  tr.r-num td.z{color:#5c6c7c;font-weight:400}
  tr.r-num td.rain{color:#9fd0ff}
  tr.r-num td .rng{font-size:3.1vh}
  tr.pr td{position:relative}
  tr.pr td.rc{border-left:2px solid var(--page, var(--bg))}                 /* 1mm以上：気象庁レーダーと同じ色の帯 */
  tr.pr td .obs{position:absolute;top:.25vh;right:.35vw;font-size:1.7vh;font-weight:400;line-height:1;color:inherit;opacity:.8}
  tr.pr th .u{font-size:2vh;margin-left:.2vw;color:var(--mute)}
  tr.r-num td.nor{font-size:2.6vh;font-weight:400;color:rgba(255,255,255,.45)}
  tr.r-num td.na{color:rgba(255,255,255,.45);font-weight:400}
  tr.r-pop th{font-size:2.6vh}
  tr.r-pop td{height:3.6vh;font-size:3vh;color:var(--mute);border-left:1px solid var(--line)}
  tr.r-pop td.hi{color:#9fd0ff;font-weight:700}
  tr.r-wd td{height:4.8vh;font-size:4vh;font-weight:700}
  tr.r-wd svg{width:3.6vh;height:3.6vh;vertical-align:middle;margin-right:.3vw}
  tr.r-wb td{font-size:4.6vh;font-weight:700;height:5.2vh}
  tr.r-wb td.c{border-left:2px solid var(--page, var(--bg))}

  /* 更新停止の表示 */
  #stale{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:rgba(18,24,32,.94);color:#f2c400;border:.4vh solid #f2c400;border-radius:1.2vh;padding:2.4vh 3vw;font-size:4.6vh;font-weight:700;text-align:center;white-space:nowrap}
  #stale small{display:block;margin-top:1vh;font-size:2.6vh;font-weight:400;color:#e8e2d6}
  body.stale #stale{display:block}
  body.stale .cur, body.stale .chart, body.stale .tbl{opacity:.35}

</style>
</head>
<body>

<header>
  <h1><b id="place">渋川市石原</b>　<span id="warns"></span><span id="camp"></span><span id="sub">屋外の暑さと天気</span></h1>
  <div class="status"><span id="error" class="warn"></span>更新 <span id="updated">--:--</span></div>
  <div id="clock">--:--</div>
</header>

<section class="cur">
  <div>
    <div class="k">気温</div>
    <div class="v"><span id="temp">--</span><span class="u">℃</span></div>
    <div class="s" id="tempSub">最高 -- ／ 最低 --</div>
    <div class="al" id="tempAl"></div>
  </div>
  <div>
    <div class="k">湿度</div>
    <div class="v"><span id="rh">--</span><span class="u">%</span></div>
    <div class="al" id="rhAl"></div>
  </div>
  <div>
    <div class="k">天気</div>
    <div class="cwx"><span id="wxIcon"></span><div class="t" id="wxText">--</div></div>
    <div class="days" id="days"></div>
  </div>
  <div>
    <div class="k">風（矢印＝吹いていく向き）</div>
    <div class="wind">
      <svg id="windArrow" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L74 50 L56 44 L56 94 L44 94 L44 44 L26 50 Z" fill="currentColor"/></svg>
      <div><div class="dir" id="windDir">--</div><div class="spd"><span id="windSpd">--</span><span class="u">m/s</span></div></div>
    </div>
    <div class="s" id="sun" style="margin-top:1.6vh"></div>
    <div class="al" id="windAl"></div>
  </div>
  <div class="wbgt">
    <div class="k" id="wbLabel">暑さ指数 WBGT（推定）</div>
    <div class="v"><span id="wbgt">--</span><span class="dec" id="wbgtDec"></span><span class="unit" id="wbUnit"></span></div>
    <div class="lv" id="lvName">取得中</div>
  </div>
</section>

<section class="chart">
  <div class="k"><span class="lg">これから12時間の気温<span id="lgWbgt">　　●の色＝WBGT危険度　<span class="chip" style="background:#1d55c2"></span>ほぼ安全<span class="chip" style="background:#2aa7c9"></span>注意<span class="chip" style="background:#e8c22e"></span>警戒<span class="chip" style="background:#ef8b1c"></span>厳重警戒<span class="chip" style="background:#d9382e"></span>危険</span></span><span class="src"><span class="diag" id="diag"></span>v<span id="ver"></span>　出典：気象庁／Open-Meteo</span></div>
  <svg id="chartTemp"></svg>
</section>

<section class="tbl"><table id="tbl"></table></section>
<div id="stale"></div>


<script>
/* ===== 設定 ===== */
const CONFIG = {
  version: '1.17',
  radar: true,                    // 「現在」の雨を気象庁レーダー（高解像度降水ナウキャスト）の観測で表示
  rainForecast: true,             // 降水の行を気象庁「今後の雨」（降水短時間予報・1km四方）で表示
  tileZoom: 10,                   // 気象庁の地図タイルの拡大段階（10＝約120m/画素）
  wbgtAlign: 'center',            // 右端の枠（WBGT／体感温度）の文字揃え：'center'（中央）または 'left'（左）
  placeName: '渋川市石原',
  lat: 36.489, lon: 139.001,   // 渋川市石原付近
  refreshMinute: 5,            // 毎時この分に更新
  tableHours: 12,              // 表に出す時間数（現在から）
  // 合議に使う数値予報モデル（Open-Meteo経由・すべて公開データ）。気象庁MSMは地域モデルなので重み2
  models: ['jma_msm','ecmwf_ifs025','gfs_seamless','icon_seamless','ukmo_seamless'],
  weights: {jma_msm: 2},
  // 背景色：今の天気に連動（暗めの色調。WBGTの5色と混同しないよう彩度は抑えめ）。夜間はさらに暗く
  skyColors: {sun:'#74601f', partly:'#5c4b2e', cloud:'#4a5058', fog:'#55616b', rain:'#16305e', snow:'#56708a', thunder:'#3b2a5e'},
  skyMode: 'full',             // 背景の塗り方：'full'（全面を暗めの天気色）。'gradient'（上だけ）／'frame'（縁取り付き）も選べる
  skyFull: {sun:'#b85a14', partly:'#4d4944', cloud:'#3a4048', chance:'#343b47', drizzle:'#1d3050', fog:'#3d474f', rain:'#142a50', snow:'#31465c', thunder:'#2d2247'},
  skyFullNight: {sun:'#1b2140', partly:'#252a38'},   // 夜の「晴れ」「曇/晴」は夜空の色（茶色く濁らせない）
  skyFrame: {sun:'#e8961e', partly:'#b59a4a', cloud:'#9aa4ad', fog:'#aab4bc', rain:'#3b78e0', snow:'#8fb6d8', thunder:'#8d6be0'},
  // 注意喚起のしきい値（現在値・表の該当セルを色付け）
  alerts: {tempHigh:35, tempLow:3, rhLow:30, windWarn:5},   // 高温／凍結（気温3℃以下）／乾燥／強風注意のしきい値
  wbgtSeason: ['04-20','10-31'],   // WBGTを表示しうる期間（月-日）。期間外は右端の枠を体感温度に切り替える
  wbgtAlways: ['06-01','08-31'],   // この期間は常にWBGTを表示（真夏）
  wbgtShowFrom: 21,                // それ以外の期間は、これから12時間でWBGTがこの値（注意）以上になるときだけWBGT、ならなければ体感温度
  winterBlock: {bg:'#2f5d8a', fg:'#ffffff'},   // 体感温度表示のときの枠の色（coldBands が空のとき）
  coldBands: [                     // 体感温度の色（社内の目安）。寒いほど氷・雪に近い白っぽい水色。min は「この値以上」
    {min:15,        bg:'#56687a'},  // 15℃以上：くすんだ灰青（寒くはない）
    {min:10,        bg:'#3c7fae'},  // 10〜14℃：青
    {min:5,         bg:'#4fb0c6'},  // 5〜9℃：氷寄りの水色
    {min:0,         bg:'#8ddbe6'},  // 0〜4℃：氷の水色（降水の水色と区別）
    {min:-5,        bg:'#c9f1f5'},  // -5〜-1℃：薄い氷
    {min:-Infinity, bg:'#effcfd'}   // -6℃以下：霜・雪の白
  ],
  tintColdRow: true,               // 表の「体感」行も同じ色にするか
  staleHours: 6,                   // この時間以上予報を更新できないと画面中央に「更新停止」を表示
  skyNight: [18, 5],           // この時刻の間は夜扱い（背景を暗くする）
  dimNight: [22, 5], dimLevel: 0.75,   // この時刻の間は画面全体を減光（1で無効）
  jmaOffice: '100000', jmaArea: '100010',   // 気象庁 府県予報（今日の概況）と地域時系列予報（3時間ごとの天気）。渋川市を含む区域
  jmaCity: '1020800',              // 気象庁 警報・注意報の市町村コード（渋川市）
  showSun: true,                   // 見出しに日の出・日の入り時刻
  showDays: true,                  // 天気の欄に明日・明後日のひとこと予報
  campaigns: [                     // 期間中だけ見出しに出す行事。from/to は月-日（年またぎ可）、weekOf は「その日を含む日〜土」、nthSunday は「第n日曜からの1週間」
    {from:'07-01', to:'07-07', label:'全国安全週間 7/1〜7'},                       // 厚生労働省
    {from:'10-01', to:'10-07', label:'全国労働衛生週間 10/1〜7'},                   // 厚生労働省
    {from:'12-15', to:'01-15', label:'年末年始無災害運動 12/15〜1/15'},            // 中央労働災害防止協会
    {from:'07-01', to:'07-31', label:'STOP!熱中症 クールワーク重点期間 7月'},        // 厚生労働省（キャンペーンは5〜9月、重点取組期間が7月）
    {spring:true, label:'春の全国交通安全運動'},                                   // 内閣府：4/6〜15（統一地方選挙の年は5/11〜20）
    {from:'09-21', to:'09-30', label:'秋の全国交通安全運動 9/21〜30'},              // 内閣府
    {from:'03-01', to:'03-07', label:'春の火災予防運動 3/1〜7'},                    // 消防庁
    {from:'11-09', to:'11-15', label:'秋の火災予防運動 11/9〜15'},                  // 消防庁
    {from:'08-30', to:'09-05', label:'防災週間 8/30〜9/5'},                        // 内閣府
    {weekOf:'09-09', label:'救急医療週間'},                                        // 厚生労働省・消防庁：9月9日を含む日〜土
    {nthSunday:[6, 2], label:'危険物安全週間'}                                      // 消防庁：6月の第2週（日〜土）
  ],
  dailyReloadHour: 3
};

/* ===== 状態 ===== */
const PAGE_T0 = Date.now();
let lastData = null, lastOk = 0, retryTimer = null, jmaText = '', jmaWarn = [], warnShown = [];
const diag = {fc:0, wx:0, warn:0, radar:0, rain:0};   // 各データの最終取得成功時刻（管理者向けの自己診断）

/* ===== 環境省の暑さ指数レベル ===== */
const LEVELS = [
  {max:21,       name:'ほぼ安全',  action:'適時に水分補給',   bg:'#1d55c2', fg:'#ffffff'},
  {max:25,       name:'注意',      action:'積極的に水分補給', bg:'#2aa7c9', fg:'#0d1b24'},
  {max:28,       name:'警戒',      action:'積極的に休息',     bg:'#e8c22e', fg:'#1c1a12'},
  {max:31,       name:'厳重警戒',  action:'激しい運動は中止', bg:'#ef8b1c', fg:'#1c1409'},
  {max:Infinity, name:'危険',      action:'運動は原則中止',   bg:'#d9382e', fg:'#ffffff'}
];
const levelOf = w => LEVELS.find(l => w < l.max);
const levelShown = w => levelOf(Math.round(w));          // 表・グラフは整数表示なので、表示した数字で色を決める

/* ===== WBGT推定（環境省 実況推定値の算出式：小野・登内 2014） ===== */
function wbgtEstimate(ta, rh, srWm2, ws){
  const sr = Math.max(0, srWm2 || 0) / 1000;
  return 0.735*ta + 0.0374*rh + 0.00292*ta*rh + 7.619*sr - 4.557*sr*sr - 0.0572*(ws||0) - 4.064;
}

/* ===== 天気コード → 日本語・アイコン ===== */
const WX = {
  0:['快晴','sun'],1:['晴れ','sun'],2:['晴れ時々曇り','partly'],3:['曇り','cloud'],45:['霧','fog'],48:['霧','fog'],
  51:['霧雨','rain'],53:['霧雨','rain'],55:['霧雨','rain'],56:['着氷性の霧雨','rain'],57:['着氷性の霧雨','rain'],

/* ===== 合議（アンサンブル）：モデルごとの値を重み付き中央値・多数決でまとめる ===== */
function wmedian(vals, ws){                       // 重み付き中央値
  const a = vals.map((v,i)=>[v, ws[i]]).sort((x,y)=>x[0]-y[0]);
  const total = a.reduce((t,x)=>t+x[1],0); let acc = 0;
  for(const [v,w] of a){ acc += w; if(acc >= total/2) return v; }
  return a[a.length-1][0];
}
function wxCat(code, cloud, precip){ return wxOf(code, cloud, precip)[1]; }   // 天気の区分（sun/partly/cloud/fog/rain/snow/thunder）

function consensusRows(h){
  const models = CONFIG.models, W = m => CONFIG.weights[m] || 1;
  const get = (v, m, i) => { const arr = h[`${v}_${m}`] || (models.length===1 ? h[v] : null); return arr ? arr[i] : null; };
  return h.time.map((s,i)=>{
    const per = [];                               // モデル別の値
    for(const m of models){
      const o = {m, w: W(m)}; let ok = false;
      for(const v of HVARS){ const x = get(v,m,i); o[v] = x; if(x!==null && x!==undefined) ok = true; }
      if(ok) per.push(o);
    }
    const med = v => { const xs = per.filter(o=>o[v]!==null && o[v]!==undefined); return xs.length ? wmedian(xs.map(o=>o[v]), xs.map(o=>o.w)) : null; };
    const wmean = v => { const xs = per.filter(o=>o[v]!==null && o[v]!==undefined); const tw = xs.reduce((t,o)=>t+o.w,0); return xs.length ? xs.reduce((t,o)=>t+o[v]*o.w,0)/tw : null; };
    const temp = med('temperature_2m'), rh = med('relative_humidity_2m'), cloud = med('cloud_cover'), pr = wmean('precipitation'),   // 降水量は重み付き平均（見込み量）
          ws = med('wind_speed_10m'), sr = med('shortwave_radiation');
    // 風向：モデルの風ベクトルの重み付き平均
    let ux=0, uy=0; per.forEach(o=>{ if(o.wind_direction_10m!==null && o.wind_speed_10m!==null){ const a=o.wind_direction_10m*Math.PI/180; ux+=o.w*o.wind_speed_10m*Math.sin(a); uy+=o.w*o.wind_speed_10m*Math.cos(a);} });
    const wd = (Math.atan2(ux, uy)*180/Math.PI + 360) % 360;
    // 天気：区分の多数決（同数なら重みの大きい気象庁MSM側）
    const votes = {}; per.forEach(o=>{ if(o.weather_code!==null){ const c = wxCat(o.weather_code, o.cloud_cover, o.precipitation); votes[c] = (votes[c]||0) + o.w; } });
    const totalW = Object.values(votes).reduce((t,x)=>t+x,0);
    const cat = Object.entries(votes).sort((x,y)=>y[1]-x[1])[0]?.[0] || 'cloud';
    // WBGT：モデルごとに計算し、中央値と幅
    const wb = per.filter(o=>o.temperature_2m!==null && o.relative_humidity_2m!==null).map(o=>({v: wbgtEstimate(o.temperature_2m,o.relative_humidity_2m,o.shortwave_radiation ?? sr ?? 0,o.wind_speed_10m ?? ws ?? 0), w:o.w}));
    const wbgt = wb.length ? wmedian(wb.map(x=>x.v), wb.map(x=>x.w)) : (temp!==null ? wbgtEstimate(temp,rh,sr,ws) : null);
    const app0 = med('apparent_temperature');
    const app = app0 !== null ? app0 : (temp !== null && rh !== null ? apparentTemp(temp, rh, ws) : null);
    const isDay = med('is_day');
    const prs = per.filter(o => o.precipitation !== null && o.precipitation !== undefined), prW = prs.reduce((t,o)=>t+o.w,0);
    const share = prW ? prs.filter(o => o.precipitation >= 0.1).reduce((t,o)=>t+o.w,0) / prW : 0;   // 雨を予想したモデルの割合（重み付き）
    return { t: parseLocal(s), temp, rh, cloud, pr, share, ws, wd, sr, cat, app, isDay, agree: totalW ? (votes[cat]/totalW) : 1,

  });
}

async function fetchWarn(){
  try{
    const r = await getWithTimeout(`https://www.jma.go.jp/bosai/warning/data/r8/${CONFIG.jmaOffice}.json`, 10000);
    const j = await r.json();
    const reports = (Array.isArray(j) ? j : [j]).slice().sort((a,b) => String(a.reportDatetime||'').localeCompare(String(b.reportDatetime||'')));
    const state = new Map();                        // 種類ごとに、いちばん新しい発表の状態を採用
    for(const rep of reports){
      const items = (rep.warning && rep.warning.class20Items) || rep.class20Items || [];
      const area = items.find(a => String(a.areaCode ?? a.code) === CONFIG.jmaCity);
      if(!area) continue;
      for(const k of (area.kinds || area.warnings || [])){ if(k && k.code) state.set(String(k.code), String(k.status || '')); }
    }
    const act = [];
    for(const [code, st] of state){
      const def = WARN[code]; if(!def) continue;
      const on = (/発表|継続/.test(st) && !/解除|なし/.test(st)) || (/警報から注意報/.test(st) && def[1] === 20);
      if(on) act.push({code, name: def[0], level: def[1], kind: def[2]});
    }
    jmaWarn = act.sort((a,b) => b.level - a.level || a.code.localeCompare(b.code));
    diag.warn = Date.now();
  }catch(e){ /* 取得できないときは前回の表示のまま */ }
  renderWarn();
}
function renderWarn(){
  const demo = new URLSearchParams(location.search).get('warn');      // ?warn=14,15 で表示の確認
  warnShown = demo ? demo.split(',').filter(c => WARN[c]).map(c => ({code:c, name:WARN[c][0], level:WARN[c][1], kind:WARN[c][2]})) : jmaWarn;
  $('warns').innerHTML = warnShown.map(w => `<span class="wchip w${w.level}">${w.name}</span>`).join('');
}
const warnHas = kind => warnShown.some(w => w.kind === kind);
/* 自己診断：右下に4つの点（予報・警報・レーダー・今後の雨）。止まっているものは名前を赤で表示 */
function renderDiag(){
  const now = Date.now(), items = [
    ['予報', Math.min(diag.fc || 0, diag.wx || 0), 3 * 3600000],
    ['警報', diag.warn, 3 * 3600000],
    ['レーダー', diag.radar, 20 * 60000],
    ['今後の雨', diag.rain, 90 * 60000]
  ];
  $('diag').innerHTML = items.map(([name, t, th]) => {
    const st = t ? (now - t < th ? 'ok' : 'ng') : (now - PAGE_T0 > th ? 'ng' : 'na');
    return st === 'ng' ? `<span class="ng"><span class="d ng"></span>${name}</span>` : `<span class="d ${st}"></span>`;
  }).join('');
}
/* 見出し：長文なら文字を少し小さくし、それでも収まらなければ「所により…」以降や末尾の語を省いて、読める形で収める */
function fitHeader(){
  const sub = $('sub'), h1 = sub.parentElement, fits = () => h1.scrollWidth <= h1.clientWidth + 1;
  if(jmaText) sub.textContent = jmaText;
  sub.style.fontSize = '';
  for(let fs = 3.0; !fits() && fs > 2.4; fs -= 0.1) sub.style.fontSize = fs.toFixed(1) + 'vh';
  if(!fits() && jmaText && jmaText.includes('：')){
    const head = jmaText.slice(0, jmaText.indexOf('：')); let words = jmaText.slice(jmaText.indexOf('：') + 1).split(' ');
    const k = words.indexOf('所により'); if(k > 1) words = words.slice(0, k);
    sub.textContent = `${head}：${words.join(' ')}`;
    while(!fits() && words.length > 3){ words = words.slice(0, -1); sub.textContent = `${head}：${words.join(' ')}`; }
  }
  for(let fs = parseFloat(sub.style.fontSize || '2.4'); !fits() && fs > 2.2; fs -= 0.1) sub.style.fontSize = fs.toFixed(1) + 'vh';
}

/* ===== 気象庁のレーダー（実況）と「今後の雨」（1時間ごとの降水予報・1km四方）を地点の画素から読む ===== */
const RAIN_BINS = [   // 気象庁の降水の配色 [R,G,B, 表示]（弱い順）
  [242,242,255,'小雨'], [160,210,255,'1〜5'], [33,140,255,'5〜10'], [0,65,255,'10〜20'],
  [250,245,0,'20〜30'], [255,153,0,'30〜50'], [255,40,0,'50〜80'], [180,0,104,'80〜']
];
let radarNow = null, rainFc = {}, rainTick = 0;
const parseUtc = s => Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8), +s.slice(8,10), +s.slice(10,12));
function tileOf(lat, lon, z){
  const n = 2 ** z, xf = (lon + 180) / 360 * n, lr = lat * Math.PI / 180, yf = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
  return {z, x: Math.floor(xf), y: Math.floor(yf), px: Math.floor((xf - Math.floor(xf)) * 256), py: Math.floor((yf - Math.floor(yf)) * 256)};
}
async function tileMaxBin(url, t, rad){   // 戻り値：-1＝雨なし、0以上＝RAIN_BINSの番号。取得・読取できなければ例外
  let r;
  try{ r = await getWithTimeout(url, 10000); }
  catch(e){ if(/HTTP 404/.test(String(e && e.message))) return -1; throw e; }   // タイルなし＝その範囲に雨雲なし
  const src = URL.createObjectURL(await r.blob());
  try{
    const im = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = src; });
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const x0 = Math.max(0, t.px - rad), y0 = Math.max(0, t.py - rad);
    const d = g.getImageData(x0, y0, Math.min(im.width - x0, 2*rad + 1), Math.min(im.height - y0, 2*rad + 1)).data;
    let best = -1;
    for(let i = 0; i < d.length; i += 4){
      if(d[i+3] < 128) continue;                                   // 透明＝雨なし
      let k = -1, md = 1e9;
      RAIN_BINS.forEach((b, j) => { const dd = (d[i]-b[0])**2 + (d[i+1]-b[1])**2 + (d[i+2]-b[2])**2; if(dd < md){ md = dd; k = j; } });
      if(md < 3000 && k > best) best = k;                          // 凡例の色から大きく外れる画素は無視
    }
    return best;
  }finally{ URL.revokeObjectURL(src); }
}
async function fetchRadar(){
  if(!CONFIG.radar) return;
  try{
    const r = await getWithTimeout('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json', 8000);
    const e = (await r.json()).filter(x => (x.elements || []).includes('hrpns')).sort((a,b) => String(b.validtime).localeCompare(String(a.validtime)))[0];
    if(!e) return;
    const t = tileOf(CONFIG.lat, CONFIG.lon, CONFIG.tileZoom);
    const bin = await tileMaxBin(`https://www.jma.go.jp/bosai/jmatile/data/nowc/${e.basetime}/none/${e.validtime}/surf/hrpns/${t.z}/${t.x}/${t.y}.png`, t, 2);
    radarNow = {bin, t: parseUtc(e.validtime)};
    diag.radar = Date.now();
  }catch(err){ /* レーダーを読めない環境では使わない（予報のみで表示） */ }
}
async function fetchRainForecast(){
  if(!CONFIG.rainForecast) return;
  try{
    const r = await getWithTimeout('https://www.jma.go.jp/bosai/jmatile/data/rasrf/targetTimes.json', 8000);
    const list = (await r.json()).filter(x => (x.elements || []).includes('rasrf') && x.basetime && x.validtime);
    const byValid = new Map();          // 予報時刻ごとに、いちばん新しい発表を使う（数時間先までと、それ以降で発表時刻が異なるため）
    for(const it of list){ const v = String(it.validtime), old = byValid.get(v); if(!old || String(it.basetime) > String(old.basetime)) byValid.set(v, it); }
    const now = Date.now(), t = tileOf(CONFIG.lat, CONFIG.lon, CONFIG.tileZoom);
    const items = [...byValid.values()].filter(it => { const T = parseUtc(String(it.validtime)); return T >= now - 2*3600000 && T <= now + 14*3600000; });
    const results = await Promise.allSettled(items.map(async it => [parseUtc(String(it.validtime)),
      await tileMaxBin(`https://www.jma.go.jp/bosai/jmatile/data/rasrf/${it.basetime}/none/${it.validtime}/surf/rasrf/${t.z}/${t.x}/${t.y}.png`, t, 1)]));
    const next = {};
    for(const k of Object.keys(rainFc)) if(+k >= now - 3*3600000) next[k] = rainFc[k];     // 読めなかった時刻は前回の値を残す
    for(const res of results) if(res.status === 'fulfilled') next[res.value[0]] = res.value[1];
    rainFc = next;                      // 時刻（その時刻までの1時間）→ 降水の区分
    if(results.some(x => x.status === 'fulfilled')) diag.rain = Date.now();
  }catch(err){ /* 一覧が読めないときは前回の値、なければ予報モデルで表示 */ }
}
/* 1時間ごとの雨：現在はレーダー観測 → 気象庁「今後の雨」 → 予報モデル の順に採用 */
function rainInfo(row, isNow){
  const fromBin = (b, src) => b < 0 ? {level:'none', text:'', src} : b === 0 ? {level:'light', text:'小雨', src} : {level:'rain', text:RAIN_BINS[b][3], bin:b, src};
  const q = new URLSearchParams(location.search).get('radar');           // ?radar=0 で「現在 小雨（観測）」の表示確認
  if(isNow && q !== null) return fromBin(parseInt(q, 10), 'radar');
  if(isNow && radarNow && Date.now() - radarNow.t < 20 * 60000) return fromBin(radarNow.bin, 'radar');
  const T = row.t.getTime();
  if(rainFc[T] !== undefined) return fromBin(rainFc[T], 'jma');
  if(row.pr === null || row.pr === undefined) return {level:'na', text:'—', src:'model'};
  if(row.pr >= 1){ const v = row.pr, b = v >= 80 ? 7 : v >= 50 ? 6 : v >= 30 ? 5 : v >= 20 ? 4 : v >= 10 ? 3 : v >= 5 ? 2 : 1;
    return {level:'rain', text: v < 10 ? v.toFixed(1) : v.toFixed(0), bin:b, src:'model'}; }
  if(row.pr >= 0.1 || row.share >= 0.34) return {level:'light', text:'小雨', src:'model'};    // 弱い雨の気配も「小雨」として出す
  return {level:'none', text:'', src:'model'};
}
/* 天気の区分を雨の情報と合わせる（曇りなのに小雨、の食い違いをなくす） */
function catWithRain(row, isNow){
  const c = catFor(row), ri = rainInfo(row, isNow);
  if(c === 'snow' || c === 'thunder') return c;
  if(ri.level === 'rain') return 'rain';
  if(ri.level === 'light') return 'drizzle';                            // その1時間の雨量が1mm未満なら、3時間予報が「雨」でも「小雨」に合わせる
  if(ri.level === 'none' && c === 'rain'){
    if(isNow && ri.src === 'radar') return 'cloud';                    // レーダーで雨雲なし＝今は降っていない
    if(ri.src === 'jma') return 'chance';                              // 3時間予報は雨、この1時間は雨雲なし＝「雨の可能性」
  }
  return c;
}

/* ===== 日の出・日の入り（天文計算。誤差1〜2分） ===== */
function sunTimes(date, lat, lon){
  const rad = Math.PI / 180, doy = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(date.getFullYear(), 0, 0)) / 86400000);
  const calc = rising => {
    const lngHour = lon / 15, t = doy + ((rising ? 6 : 18) - lngHour) / 24, M = 0.9856 * t - 3.289;
    let L = (M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634 + 360) % 360;
    let RA = (Math.atan(0.91764 * Math.tan(L * rad)) / rad + 360) % 360;
    RA = (RA + Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90) / 15;
    const sinDec = 0.39782 * Math.sin(L * rad), cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if(cosH > 1 || cosH < -1) return null;
    const H = (rising ? 360 - Math.acos(cosH) / rad : Math.acos(cosH) / rad) / 15;
    let UT = (H + RA - 0.06571 * t - 6.622 - lngHour) % 24; if(UT < 0) UT += 24;
    return new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) + UT * 3600000);
  };
  return {rise: calc(true), set: calc(false)};
}
function renderSun(now){
  if(!CONFIG.showSun) return;
  const s = sunTimes(now, CONFIG.lat, CONFIG.lon);
  const hm = d => `${d.getHours()}:${pad(d.getMinutes())}`;
  $('sun').textContent = (s.rise && s.set) ? `日の出 ${hm(s.rise)}　日の入り ${hm(s.set)}` : '';
}
/* ===== 行事（安全週間など）：期間中だけ見出しに表示 ===== */
function renderCampaign(now){
  const y = now.getFullYear(), md = pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  const d0 = new Date(y, now.getMonth(), now.getDate()), day = 86400000;
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  const on = [];
  for(const c of (CONFIG.campaigns || [])){
    if(c.from){ if(c.from <= c.to ? (md >= c.from && md <= c.to) : (md >= c.from || md <= c.to)) on.push(c.label); continue; }
    if(c.spring){                                             // 春の全国交通安全運動：統一地方選挙の年（2023+4n）は5/11〜20
      const uni = (y - 2023) % 4 === 0, a = uni ? '05-11' : '04-06', b = uni ? '05-20' : '04-15';
      if(md >= a && md <= b) on.push(`${c.label} ${uni ? '5/11〜20' : '4/6〜15'}`); continue;
    }
    let start = null;
    if(c.weekOf){ const t = new Date(y, +c.weekOf.slice(0,2) - 1, +c.weekOf.slice(3)); start = new Date(t.getTime() - t.getDay() * day); }
    if(c.nthSunday){ const f = new Date(y, c.nthSunday[0] - 1, 1); start = new Date(f.getTime() + ((7 - f.getDay()) % 7 + 7 * (c.nthSunday[1] - 1)) * day); }
    if(start){ const end = new Date(start.getTime() + 6 * day); if(d0 >= start && d0 <= end) on.push(`${c.label} ${fmt(start)}〜${fmt(end)}`); }
  }
  $('camp').innerHTML = on.slice(0, 2).map(l => `<span class="wchip camp">${l}</span>`).join('');
}
/* ===== 明日・明後日のひとこと予報：天気は気象庁の府県予報、気温は予報モデルの合議 ===== */
let jmaDays = [];
function dayCat(text){
  const first = String(text).trim().split(/[\s\u3000]+/)[0] || '';
  if(/雷/.test(text)) return 'thunder';
  if(/^雪/.test(first)) return 'snow';
  if(/^雨/.test(first)) return 'rain';
  if(/雨|雪/.test(text)) return 'chance';                     // 「くもり 時々 雨」などは 曇/雨
  if(/晴/.test(text) && /(くもり|曇)/.test(text)) return 'partly';
  return /晴/.test(text) ? 'sun' : 'cloud';
}
function renderDays(rows, now){
  if(!CONFIG.showDays) return;
  const out = [];
  for(const [i, name] of [[1, '明日'], [2, '明後日']]){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i), key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const temps = rows.filter(r => r.t.getFullYear() === d.getFullYear() && r.t.getMonth() === d.getMonth() && r.t.getDate() === d.getDate() && r.temp !== null).map(r => r.temp);
    const j = jmaDays.find(x => x.key === key);
    if(!j && !temps.length) continue;
    const cat = j ? dayCat(j.text) : null;
    out.push(`<span class="n">${name}</span><span class="w">${cat ? iconFor(cat, false) + catLabel(cat, null) : '—'}</span><span class="tp">${temps.length ? `<b>${Math.round(Math.max(...temps))}</b>/${Math.round(Math.min(...temps))}℃` : ''}</span>`);
  }
  $('days').innerHTML = out.join('');
}

/* ===== 現在値：表の「現在」列と同じ値 ===== */
function renderNow(rows, i0, now){
  const a = rows[i0];                                                       // 表の「現在」列と同じ値を使う
  const temp = a.temp, rh = a.rh, ws = a.ws, root = document.documentElement.style;
  if(heatOn){
    const test = new URLSearchParams(location.search).get('test');        // ?test=29.5 で色の確認
    const wbgt = test !== null ? parseFloat(test) : a.wbgt, lv = levelShown(wbgt);   // 表と同じく整数に四捨五入して表示・判定
    root.setProperty('--lv-bg', lv.bg); root.setProperty('--lv-fg', lv.fg);
    $('wbLabel').textContent = '暑さ指数 WBGT（推定）'; $('wbUnit').textContent = '';
    setBigNumber(wbgt, false);
    $('lvName').textContent = lv.name; $('lvName').classList.remove('small');
  }else{                                                                   // WBGTの期間外は体感温度
    const qa = new URLSearchParams(location.search).get('app');                    // ?app=-3 で色の確認
    const app = qa !== null ? parseFloat(qa) : (a.app ?? temp), d = Math.round(app - temp);
    const cb = coldOf(app);
    root.setProperty('--lv-bg', cb ? cb.bg : CONFIG.winterBlock.bg); root.setProperty('--lv-fg', cb ? inkOn(cb.bg) : CONFIG.winterBlock.fg);
    $('wbLabel').textContent = '体感温度（風・湿度を加味）'; $('wbUnit').textContent = '℃';
    setBigNumber(app, false);
    $('lvName').textContent = d <= -1 ? `気温より${-d}℃低い` : d >= 1 ? `気温より${d}℃高い` : '気温とほぼ同じ';
    $('lvName').classList.add('small');
  }
  document.querySelector('.wbgt').classList.toggle('winter', !heatOn);
  fitBig();

  const today = rows.filter(r => r.t.getDate() === now.getDate() && r.temp!==null).map(r=>r.temp);
  $('temp').textContent = Math.round(temp);
  $('tempSub').textContent = today.length ? `最高${Math.round(Math.max(...today))}℃ 最低${Math.round(Math.min(...today))}℃` : '';
  $('rh').textContent = Math.round(rh);
  $('rh').parentElement.style.fontSize = Math.round(rh) >= 100 ? 'min(9.5vh,5.3vw)' : '';

  const forced = new URLSearchParams(location.search).get('wx');      // ?wx=rain などで天気表示・背景色の確認
  const cur = a, cc = (forced && ICON[forced]) ? forced : catWithRain(cur, true);
  const night = isNightRow(cur);
  $('wxIcon').innerHTML = iconFor(cc, night);
  $('wxText').textContent = catLabel(cc, cur.cloud);
  setSky(cc, night);

  if(ws < 0.3){ $('windDir').textContent = '静穏'; $('windArrow').style.opacity = .25; }
  else{
    $('windDir').textContent = dirName(cur.wd) + 'の風';
    $('windArrow').style.transform = `rotate(${(cur.wd + 180) % 360}deg)`;
    $('windArrow').style.opacity = 1;
  }
  $('windSpd').textContent = ws.toFixed(1);
  // 注意喚起バッジ
  const A = CONFIG.alerts, q = new URLSearchParams(location.search).get('alert');   // ?alert=1 で表示テスト
  const badge = (id, text) => { $(id).textContent = text || ''; };
  const tR = Math.round(temp), hR = Math.round(rh), wR = Math.round(ws * 10) / 10;   // 表示している数字で判定
  badge('tempAl', q ? '高温注意' : tR >= A.tempHigh ? '高温注意' : tR <= A.tempLow ? '凍結注意' : '');
  badge('rhAl',   q ? '乾燥注意' : (hR <= A.rhLow && !warnHas('dry')) ? '乾燥注意' : '');        // 気象庁の乾燥注意報が出ていれば見出し側に任せる
  badge('windAl', q ? '強風注意' : (wR >= A.windWarn && !warnHas('wind')) ? '強風注意' : '');    // 強風注意報・暴風警報も同様
}
/* 背景を今の天気の色に。夜はベース色に寄せて暗くする */
function setSky(cat, night){
  const hex = CONFIG.skyColors[cat] || CONFIG.skyColors.cloud;
  const mix = (a, b, t) => { const pa = [1,3,5].map(i=>parseInt(a.slice(i,i+2),16)), pb = [1,3,5].map(i=>parseInt(b.slice(i,i+2),16)); return '#' + pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join(''); };
  document.documentElement.style.setProperty('--sky', night ? mix(hex, '#1c2733', 0.55) : hex);
  const root = document.documentElement.style;
  if(CONFIG.skyMode === 'gradient'){ root.removeProperty('--bgimg'); root.removeProperty('--page'); root.setProperty('--frame-w','0'); return; }
  const full = CONFIG.skyFull[cat] || CONFIG.skyFull.cloud, fullC = night ? ((CONFIG.skyFullNight || {})[cat] || mix(full, '#1c2733', 0.5)) : full;
  root.setProperty('--bgimg', fullC); root.setProperty('--page', fullC);
  if(CONFIG.skyMode === 'frame'){ root.setProperty('--frame', CONFIG.skyFrame[cat] || CONFIG.skyFrame.cloud); root.setProperty('--frame-w', '1.2vh'); }
  else root.setProperty('--frame-w', '0');
}
function catLabel(cat, cloud){
  if(cat==='sun') return (cloud!==null && cloud !== undefined && cloud <= 10) ? '快晴' : '晴れ';
  return {partly:'曇/晴', cloud:'曇り', chance:'曇/雨', drizzle:'小雨', fog:'霧', rain:'雨', snow:'雪', thunder:'雷雨'}[cat] || '—';
}

/* ===== 表：現在から12時間 ===== */
function renderTable(rows, i0, now){
  const cols = rows.slice(i0, i0 + CONFIG.tableHours);
  const cls = i => i===0 ? 'class="hl"' : '';
  let html = '';
  html += `<tr class="r-hd"><th>時刻</th>${cols.map((r,i)=>`<td ${cls(i)}>${i===0?'現在':hourLabel(r.t, now)}</td>`).join('')}</tr>`;
  html += `<tr class="r-wx"><th>天気</th>${cols.map((r,i)=>{const c=catWithRain(r, i===0);return `<td ${cls(i)}>${iconFor(c, isNightRow(r))}<small>${catLabel(c, r.cloud)}</small></td>`;}).join('')}</tr>`;
  const A = CONFIG.alerts, tc = (i, extra) => `class="${i===0?'hl ':''}${extra||''}"`;
  html += `<tr class="r-num"><th>気温</th>${cols.map((r,i)=>`<td ${tc(i, (Math.round(r.temp)>=A.tempHigh||Math.round(r.temp)<=A.tempLow)?'warn':'')}>${Math.round(r.temp)}<small>℃</small></td>`).join('')}</tr>`;
  html += `<tr class="r-num"><th>湿度</th>${cols.map((r,i)=>`<td ${tc(i, Math.round(r.rh)<=A.rhLow?'warn':'')}>${Math.round(r.rh)}<small>%</small></td>`).join('')}</tr>`;
  const rains = cols.map((r,i) => rainInfo(r, i===0)), cats = cols.map((r,i) => catWithRain(r, i===0));
  if(rains.every(x => x.level === 'none') && !cats.includes('chance')){
    html += `<tr class="r-num pr"><th>降水<span class="u">mm</span></th><td class="hl z"></td><td class="nor" colspan="${cols.length-1}">この先12時間 雨の予想なし</td></tr>`;
  }else{
    html += `<tr class="r-num pr"><th>降水<span class="u">mm</span></th>${rains.map((x,i) => {
      const obs = '';
      if(x.level === 'rain'){                                              // 1mm以上：色が濃いほど強い雨（気象庁レーダーと同じ配色）
        const [r, g, b] = RAIN_BINS[x.bin], fg = [2,3,6,7].includes(x.bin) ? '#ffffff' : '#1c2733';
        const fs = x.text.length >= 5 ? 'font-size:3.2vh;' : x.text.length === 4 ? 'font-size:3.5vh;' : '';
        return `<td class="rc" style="background:rgb(${r},${g},${b});color:${fg};${fs}">${x.text}${obs}</td>`;
      }
      const cl = (i===0 ? 'hl ' : '') + (x.level==='na' ? 'na' : x.level==='none' ? 'z' : 'rain');   // 「降るかもしれない」は天気の欄の曇/雨だけで示す
      return `<td class="${cl}">${x.text}${obs}</td>`;
    }).join('')}</tr>`;
  }
  // 降水確率：気象庁の6時間区分ごとに1セル（結合表示）
  const groups = [];
  cols.forEach((r,i)=>{ const key = popKey(r); const g = groups[groups.length-1]; if(g && g.key===key) g.n++; else groups.push({key, n:1, pop: popFor(r)}); });
  html += `<tr class="r-pop"><th>降水確率</th>${groups.map(g=>`<td colspan="${g.n}" class="${g.pop!==null&&g.pop>=50?'hi':''}">${g.pop!==null?g.pop+'%':'—'}</td>`).join('')}</tr>`;
  html += `<tr class="r-wd"><th>風速</th>${cols.map((r,i)=>`<td ${tc(i, Math.round(r.ws*10)/10>=A.windWarn?'warn':'')}>${r.ws<0.3?'<span style="font-size:2.8vh;font-weight:400;color:var(--mute)">静穏</span>':ARROW.replace('DEG',(r.wd+180)%360)+r.ws.toFixed(1)}</td>`).join('')}</tr>`;
  if(heatOn) html += `<tr class="r-wb"><th>WBGT</th>${cols.map((r,i)=>{const l=levelShown(r.wbgt);return `<td class="c" style="background:${l.bg};color:${l.fg}">${Math.round(r.wbgt)}</td>`;}).join('')}</tr>`;
  else if(CONFIG.tintColdRow) html += `<tr class="r-wb"><th>体感</th>${cols.map((r,i)=>{const v=r.app ?? r.temp, cb=coldOf(v);return `<td class="c" style="background:${cb ? cb.bg : CONFIG.winterBlock.bg};color:${cb ? inkOn(cb.bg) : '#ffffff'}">${Math.round(v)}<small style="font-size:.5em">℃</small></td>`;}).join('')}</tr>`;
  else html += `<tr class="r-num"><th>体感</th>${cols.map((r,i)=>`<td ${tc(i, '')}>${Math.round(r.app ?? r.temp)}<small>℃</small></td>`).join('')}</tr>`;
  $('tbl').innerHTML = html;
}

/* ===== グラフ：表と同じ12時間・同じ列位置。上＝気温（主役）、下＝WBGT（帯＝危険度） ===== */
function colX(svg, n){
  const sx = svg.getBoundingClientRect().left;
  const cells = [...document.querySelectorAll('#tbl tr.r-hd td')];
  if(cells.length !== n){ const W = svg.clientWidth||1200; return {xs: Array.from({length:n},(_,i)=>W*0.07+W*0.93*(i+0.5)/n), left:W*0.07, right:W}; }
  const r0 = cells[0].getBoundingClientRect();
  return { xs: cells.map(c=>{const r=c.getBoundingClientRect(); return r.left + r.width/2 - sx;}),
           left: r0.left - sx, right: cells[cells.length-1].getBoundingClientRect().right - sx, x0: r0.left - sx, w0: r0.width };
}
const vh = p => window.innerHeight * p / 100;

function renderChart(rows, i0, now){
  const summer = heatOn;
  $('lgWbgt').style.display = summer ? '' : 'none';
  const pts = rows.slice(i0, i0 + CONFIG.tableHours);
  const svg = $('chartTemp');
  const W = svg.clientWidth || 1200, H = svg.clientHeight || 220;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const {xs, left, right, x0, w0} = colX(svg, pts.length);
  const fsT = vh(2.4), r = Math.max(6, vh(1.1));
  const m = {t: r + vh(0.8), b: r + vh(0.8)};
  const ts = pts.map(p=>p.temp).filter(v=>v!==null);
  // 目盛：数字が詰まらない間隔（2・5・10℃刻み）で3〜4本まで。変化の小さい日は8℃幅を確保して大げさに見せない
  const maxIv = Math.max(2, Math.floor((H - m.t - m.b) / (fsT * 2.3)));
  let lo = Math.floor(Math.min(...ts) - 1), hi = Math.ceil(Math.max(...ts) + 1);
  if(hi - lo < 8){ const c = (lo + hi) / 2; lo = Math.floor(c - 4); hi = lo + 8; }
  const step = [2, 5, 10, 20].find(st => Math.ceil(hi / st) - Math.floor(lo / st) <= maxIv) || 20;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const Y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  let s = `<rect x="${left}" y="${m.t}" width="${right-left}" height="${H-m.t-m.b}" fill="#ffffff" opacity=".04"/>`;
  if(w0) s += `<rect x="${x0}" y="0" width="${w0}" height="${H}" fill="#ffffff" opacity=".10"/>`;   // 「現在」の列を表からグラフまで通す
  for(let v = lo; v <= hi; v += step){
    s += `<line x1="${left}" x2="${right}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff" opacity=".14"/>`;
    s += `<text x="${left-8}" y="${Y(v)+fsT*0.35}" font-size="${fsT}" fill="rgba(255,255,255,.72)" text-anchor="end">${v}℃</text>`;
  }
  xs.forEach(x => { s += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${H-m.b}" stroke="#ffffff" opacity=".07"/>`; });
  s += `<path d="${pts.map((p,i)=>`${i?'L':'M'}${xs[i].toFixed(1)},${Y(p.temp).toFixed(1)}`).join(' ')}" fill="none" stroke="#f4efe6" stroke-width="${Math.max(3, vh(0.5))}" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{ const fill = summer ? levelShown(p.wbgt).bg : '#f4efe6'; s += `<circle cx="${xs[i]}" cy="${Y(p.temp)}" r="${r}" fill="${fill}" stroke="#f4efe6" stroke-width="${Math.max(2, vh(0.3))}"/>`; });
  svg.innerHTML = s;
}

/* ===== 更新スケジュール ===== */
function renderAll(d){
  const rows = consensusRows(d.hourly), now = new Date();
  const k = rows.findIndex(r => r.t.getTime() > now.getTime());
  if(k === -1) return;                       // 手元の予報の範囲外（長時間の停止）→「更新停止」の表示に任せる
  const i0 = Math.max(0, k - 1);
  heatOn = heatMode(rows, i0, now);
  renderTable(rows, i0, now); renderChart(rows, i0, now); renderNow(rows, i0, now);
  renderSun(now); renderCampaign(now); renderDays(rows, now); renderDiag(); fitHeader();
}
async function refresh(){
  let ok = false;
  try{ lastData = await fetchWeather(); ok = true; }catch(e){ /* 下で処理 */ }
  await Promise.all([fetchJmaWx(), fetchJma(), fetchWarn(), fetchRadar(), fetchRainForecast()]);   // 気象庁の各情報は個別に失敗しても前回値を保持
  if(lastData) renderAll(lastData);          // 取得に失敗しても、手元にある3日分の予報で「現在」を進める
  fitHeader();
  if(ok){
    lastOk = Date.now();
    $('updated').textContent = fmtHM(new Date());
    $('error').textContent = '';
    if(retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
  }else{
    $('error').textContent = `更新失敗 ${fmtHM(new Date())}・再試行中`;
    if(!retryTimer) retryTimer = setTimeout(()=>{ retryTimer=null; refresh(); }, 10*60*1000);
  }
  checkStale();
}
/* 長時間更新できないときは画面中央に表示（時計だけ動いて古い値を出し続けるのを防ぐ） */
function checkStale(){
  const base = lastOk || PAGE_T0, age = Date.now() - base;
  const stale = lastOk ? age > CONFIG.staleHours * 3600000 : age > 30 * 60000;
  document.body.classList.toggle('stale', stale);
  if(stale){
    const t = new Date(base), today = new Date();
    const when = (t.toDateString() === today.toDateString() ? '' : `${t.getMonth()+1}/${t.getDate()} `) + fmtHM(t);
    $('stale').innerHTML = lastOk ? `予報の更新が止まっています<small>最終更新 ${when}　ネット回線・電源を確認してください</small>`
                                  : `予報を取得できません<small>ネット回線を確認してください</small>`;
  }
}
function scheduleNext(){
  const now = new Date(), next = new Date(now);
  next.setMinutes(CONFIG.refreshMinute, 0, 0);
  if(next <= now) next.setHours(next.getHours()+1);
  setTimeout(()=>{ refresh(); scheduleNext(); }, next - now);
}
let rerenderTimer = null;
const rerender = () => { if(!lastData) return; clearTimeout(rerenderTimer); rerenderTimer = setTimeout(()=>renderAll(lastData), 150); };
window.addEventListener('resize', rerender);
/* レーダーは5分ごと、「今後の雨」は30分ごとに取り直して「現在」と降水の行を更新 */
setInterval(async () => {
  await fetchRadar();
  if(++rainTick % 6 === 0) await fetchRainForecast();
  if(lastData) renderAll(lastData);
}, 5 * 60 * 1000);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(rerender);   // Webフォント読込後に列位置を再計算
if(window.ResizeObserver) new ResizeObserver(rerender).observe($('chartTemp'));

{ const bg = new URLSearchParams(location.search).get('bg'); if(bg) CONFIG.skyMode = bg; }
$('place').textContent = CONFIG.placeName;
$('ver').textContent = CONFIG.version;
refresh();
scheduleNext();
</script>
